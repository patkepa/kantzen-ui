name: Deploy Showcases

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build packages
        run: npm run build:packages

      - name: Build landing page
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build:playground

      - name: Build Starlight showcase
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/starlight/
          SITE_URL: ${{ steps.pages.outputs.origin }}
        run: npm run build:starlight

      - name: Assemble showcase artifact
        run: npm run assemble:pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
